const _leave8=leave;leave=function(){if(NET.on){netSend({t:'bye'});netClose()}_leave8()};
/* ===== BATCH 9: ranked 1v1, locker, roll, rarity odds, training button, bigger skin previews ===== */
var RK1=0,INM=0,LKT='sk',RROLL=null;


/* ---- Jacob's rank: back to Emerald I (once) ---- */
const _show9=show;
function jacobAll(){eco();let ch=0;ALLK().forEach(k=>{if(!U.ex.includes(k)){U.ex.push(k);ch=1}});OPS.forEach((o,i)=>{if(o.shop&&!U.ops.includes(i)){U.ops.push(i);ch=1}});if(U.max<1000){U.max=1000;ch=1}if(ch)saveU()}
show=function(v){try{if(U&&isJacob(U.name)){if(!U.ej1){U.ej1=1;U.rp=1700;saveU()}jacobAll()}}catch(_){}
 if(v=='home'||v=='login')INM=0;return _show9(v)};
const _init9=init;init=function(){INM=1;_init9()};

/* ---- 1v1 as part of ranked ---- */
const _start9=start;start=function(){if(pm=='rduel'){pm='duel';RK1=1}else RK1=0;_start9()};
const _go9=go;go=function(m){RK1=0;_go9(m)};
const _fin9=fin;fin=function(){if(RK1&&mode=='duel'&&!NET.on){mode='ranked';try{_fin9()}finally{mode='duel'}}else _fin9()};
const _leave9=leave;leave=function(){if(RK1&&mode=='duel'&&!NET.on){mode='ranked';try{_leave9()}finally{mode='duel'}}else _leave9()};
const _diff9=diff;diff=function(){if(RK1&&mode=='duel'){mode='ranked';try{return _diff9()}finally{mode='duel'}}return _diff9()};

/* ---- home screen: Training under settings, Locker, Competitive 1v1 ---- */
const _home9=home;
home=function(){let h=_home9();
 h=h.replace(/<button class='mb red' onclick="show\('train'\)">TRAINING<\/button>/,'');
 h=h.replace(/<button class='mb red' onclick="pre\('duel'\)">[^<]*<\/button>/,'');
 h=h.replace(/(<button class='gear'[^>]*>[^<]*<\/button>)/,"$1<button class='gear2' onclick=\"show('train')\">🎯 TRAINING &amp; TUTORIAL</button>");
 h=h.replace(/(<button class='mb gold' onclick="pre\('ranked'\)">[^<]*<\/button>)/,"$1<button class='mb gold' onclick=\"pre('rduel')\">COMPETITIVE &middot; 1v1 DUEL</button>");
 h=h.replace(/(<button class='mb gold' onclick="show\('shop'\)">[^<]*<\/button>)/,"$1<button class='mb blue' onclick=\"show('locker')\">LOCKER</button>");
 return h};

/* ---- rarity tables (percent chance per roll) ---- */
const RAR={c:{n:'Common',p:33,col:'#9aa7b5'},u:{n:'Uncommon',p:33,col:'#5fd37a'},r:{n:'Rare',p:20,col:'#4aa8ff'},e:{n:'Epic',p:10,col:'#c77dff'},l:{n:'Legendary',p:3,col:'#ffb300'},x:{n:'Mythic',p:1,col:'#ff2d55'}};
const RT9=['c','u','r','e','l','x'];
const RSK={c:['SK_COBALT','SK_JUNGLE','DS10','DS5','DS15','DS13','DS2','DS18'],u:['SK_SUNSET','DS12','DS11','DS7','DS3','DS4','DS14','DS1'],r:['SK_PHANTOM','DS6','DS9','DS8','DS0'],e:['SK_MAGMA','SK_FROST','DS17'],l:['DS16','DS19'],x:['SK_CHROMA']};
const RGS={c:['GS_CAMO','GW4','GW5','GW12','GW16','GW0','GW9'],u:['GS_ICE','GS_CARBON','GW1','GW2','GW3','GW6','GW8','GW11'],r:['GS_CHERRY','GW7','GW10','GW13','GW14'],e:['GW15','GW17','GW18'],l:['GS_GOLD','GW19'],x:['GS_CHROMA']};
const skinInfo=k=>SSK.concat(DSK).find(s=>s.k==k)||{n:k,c:0x888888,k};
const wrapInfo=k=>GSK.find(s=>s.k==k)||{n:k,c:0x888888,k};
const SKR={};RT9.forEach(t=>RSK[t].forEach(k=>{if(SKI[k]!=null)SKR[SKI[k]]=t}));
const GWR={};RT9.forEach(t=>RGS[t].forEach(k=>GWR[k]=t));
function rollPick(kind){let r=Math.random()*100,acc=0,t='c';for(const k of RT9){acc+=RAR[k].p;if(r<acc){t=k;break}}
 const T=kind=='sk'?RSK:RGS;return{t,key:T[t][Math.random()*T[t].length|0]}}
function doRoll(kind,cur){eco();smsg='';const P=kind=='sk'?[1000,15]:[800,12];if(!pay(P[0],P[1],cur)){return show('shop')}
 const{t,key}=rollPick(kind),dup=U.ex.includes(key);let refund='';
 if(dup){if(t=='x'){U.sc+=50;refund='Duplicate! You got 50 💎 back.'}else{const c={c:150,u:300,r:600,e:1200,l:3000}[t];U.tc+=c;refund='Duplicate! You got '+c+' 🪙 back.'}}else grantEx(key);
 RROLL={kind,key,t,refund,fresh:!dup};saveU();show('shop')}
const pct=x=>(Math.round(x*100)/100)+'%';
function oddsHTML(T,nm){return `<table class='oddt'>${RT9.map(t=>{const n=T[t].length,p=RAR[t].p;return `<tr><td style='color:${RAR[t].col};font-weight:800'>${RAR[t].n}</td><td><b>${p}%</b></td><td>${n} item${n>1?'s':''} &middot; ${pct(p/n)} each</td></tr><tr><td colspan=3>${T[t].map(k=>`<span class='rtag' style='border:1px solid ${RAR[t].col}77'>${nm(k)}</span>`).join(' ')}</td></tr>`}).join('')}</table>`}
const wrapBox=(s,sz)=>`<div class='gprev${s.chroma?' chromasw2':''}' style='background:linear-gradient(135deg,${s.c?hx(s.c):'#444'},#10151f)'><svg viewBox='-30 -22 110 56' width='${sz||190}' height='${(sz||190)*.53}' fill='#fff'>${svgGun('ar')}</svg></div>`;
function rollView(){eco();let res='';
 if(RROLL){const R=RROLL,col=RAR[R.t].col,isS=R.kind=='sk',it=isS?skinInfo(R.key):wrapInfo(R.key);
  res=`<div class='rres' style='border-color:${col}'><div style='color:${col};font-weight:900;letter-spacing:2px'>${RAR[R.t].n.toUpperCase()}${R.t=='x'||R.t=='l'?' &#10024;':''}</div>${isS?`<div class='${R.t=='x'?'chromasw2':''}' style='display:flex;justify-content:center'>${soldier(it.c,0x2b3038,100,0)}</div>`:wrapBox(it,230)}<h3 style='margin:4px'>${it.n}</h3><small>${isS?'Character skin':'Gun wrap'} &middot; ${R.fresh?'NEW! Equip it in the Locker':R.refund}</small></div>`}
 const sec=(kind,title,tc,sc,T,nm)=>`<div class='card' style='align-items:stretch;text-align:left'><h3 style='margin:0'>${title}</h3><div class='row'><button class='buy' onclick="doRoll('${kind}','tc')">🪙 ${tc}</button><button class='buy cr' onclick="doRoll('${kind}','sc')">💎 ${sc}</button></div><b>Chances</b>${oddsHTML(T,nm)}<small>Duplicates give coins back (Common 150, Uncommon 300, Rare 600, Epic 1200, Legendary 3000 &middot; Mythic 50 💎). The Chroma Streak is the Mythic and can only be won here.</small></div>`;
 return `<h3>🎰 Roll for a skin or gun wrap</h3><small>Every roll shows its exact odds below. Higher rarity = lower chance. The Mythic Chroma Streak is a <b>1%</b> chance on every roll.</small>${res}<div class='cards' style='grid-template-columns:repeat(auto-fit,minmax(300px,1fr))!important'>${sec('sk','🎨 Skin Roll',1000,15,RSK,k=>skinInfo(k).n)}${sec('gs','🔫 Gun Wrap Roll',800,12,RGS,k=>wrapInfo(k).n)}</div>`}
VW.roll=rollView;

/* ---- Locker: the only place to equip skins and gun wraps ---- */
const ownSkin=i=>isJacob(U.name)||!(U.max<SKINS[i][2]);
const ownWrap=s=>(!s.p&&!s.chroma)||isJacob(U.name)||(U.ex||[]).includes(s.k);
function lockEq(i){if(INM){smsg='You cannot change skins during a match.';return}eco();if(!SKINS[i]||!ownSkin(i))return;U.skin=i;saveU();show('locker')}
function lockWrap(k){if(INM){smsg='You cannot change gun wraps during a match.';return}eco();const s=GSK.find(q=>q.k==k);if(!s||!ownWrap(s))return;U.gsk=k;saveU();show('locker')}
equipSK=function(){LKT='sk';show('locker')};equipGS=function(){LKT='gs';show('locker')};
function lockerView(){eco();const cur=SKINS[U.skin]||SKINS[0],cw=GSK.find(q=>q.k==(U.gsk||'GS0'))||GSK[0],cch=cur[0]=='Chroma Streak';
 const tabs=`<div class='tabs'><button class='tabb${LKT=='sk'?' on':''}' onclick="LKT='sk';show('locker')">🎨 SKINS</button><button class='tabb${LKT=='gs'?' on':''}' onclick="LKT='gs';show('locker')">🔫 GUN WRAPS</button><button class='tabb' onclick="shTab='roll';show('shop')">🎰 ROLL</button><button class='tabb' onclick="show('shop')">SHOP</button><button class='tabb' onclick="show('home')">BACK</button></div>`;
 const big=`<div class='lkbig'><div class='${cch?'chromasw2':''}'>${soldier(cur[1],0x2b3038,110,U.skin==GI)}</div><div style='text-align:center'>${wrapBox(cw,260)}<div style='margin-top:6px'><b>${cur[0]}</b><br><small>Skin</small> &nbsp; <b>${cw.n}</b><br><small>Gun wrap</small></div></div></div>`;
 let body='';
 if(LKT=='sk')body=`<div class='cards'>${SKINS.map((s,i)=>{const own=ownSkin(i),t=SKR[i],col=t?RAR[t].col:'#ffffff2a',ch=s[0]=='Chroma Streak';return `<div class='card rr' style='border-color:${col};opacity:${own?1:.45}'><div class='pvs${ch?' chromasw2':''}'>${soldier(s[1],0x2b3038,44,i==GI)}</div><b>${s[0]}</b>${t?`<small style='color:${col};font-weight:800'>${RAR[t].n}</small>`:'<small>Starter</small>'}${own?(U.skin==i?"<div class='own'>EQUIPPED</div>":`<button class='buy' onclick="lockEq(${i})">Equip</button>`):"<div style='opacity:.8'>🔒 Locked<br><small>Shop or Roll</small></div>"}</div>`}).join('')}</div>`;
 else body=`<div class='cards'>${GSK.map(s=>{const own=ownWrap(s),t=GWR[s.k],col=t?RAR[t].col:'#ffffff2a';return `<div class='card rr' style='border-color:${col};opacity:${own?1:.45}'>${wrapBox(s,170)}<b>${s.n}</b>${t?`<small style='color:${col};font-weight:800'>${RAR[t].n}</small>`:'<small>Default</small>'}${own?((U.gsk||'GS0')==s.k?"<div class='own'>EQUIPPED</div>":`<button class='buy' onclick="lockWrap('${s.k}')">Equip</button>`):"<div style='opacity:.8'>🔒 Locked<br><small>Shop or Roll</small></div>"}</div>`}).join('')}</div>`;
 return `<h2>Locker</h2>${curBar()}${tabs}${smsg?`<div class='smsg'>${smsg}</div>`:''}${big}<small>Skins and gun wraps can only be changed here, not during a match.</small>${body}<div class='row'><button onclick="show('home')">Back</button></div>`}
VW.locker=lockerView;

/* shop: equip buttons now point to the Locker */
const _sv9=VW.shop;
VW.shop=function(){return _sv9().replace(/<button class='buy' onclick="equip(SK|GS)\('[^']*'\)">Equip<\/button>/g,(m,t)=>`<button class='buy' onclick="LKT='${t=='SK'?'sk':'gs'}';show('locker')">Owned &middot; Locker</button>`)};
/* pre-match screen no longer picks skins */
skinGrid=function(){return ''};

</script></body></html>
